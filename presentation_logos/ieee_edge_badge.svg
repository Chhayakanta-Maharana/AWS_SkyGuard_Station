<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="ieeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="2" y="2" width="196" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <!-- IEEE / Chip Icon -->
  <g transform="translate(12, 10)">
    <circle cx="20" cy="20" r="18" fill="url(#ieeeGrad)"/>
    <!-- CPU Chip lines -->
    <rect x="13" y="13" width="14" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="16" y="16" width="8" height="8" rx="1" fill="#4f46e5"/>
    <line x1="20" y1="7" x2="20" y2="12" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="20" y1="28" x2="20" y2="33" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="7" y1="20" x2="12" y2="20" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="28" y1="20" x2="33" y2="20" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <!-- Text -->
  <text x="60" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#0f172a" letter-spacing="1">IEEE 754 / IoT</text>
  <text x="60" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4f46e5">EDGE BUFFER ARCH</text>
</svg>
