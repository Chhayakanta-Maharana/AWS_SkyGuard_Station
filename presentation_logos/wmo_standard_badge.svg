<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="wmoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="2" y="2" width="196" height="56" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <!-- Globe / WMO Icon -->
  <g transform="translate(12, 10)">
    <circle cx="20" cy="20" r="18" fill="url(#wmoGrad)"/>
    <!-- Latitude/Longitude lines -->
    <ellipse cx="20" cy="20" rx="9" ry="18" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="2" y1="20" x2="38" y2="20" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="5" y1="11" x2="35" y2="11" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="5" y1="29" x2="35" y2="29" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,1"/>
    <!-- Weather cloud symbol -->
    <path d="M14 26 Q17 22 21 24 Q26 21 28 25 Q30 26 29 28 L13 28 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Text -->
  <text x="60" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#0f172a" letter-spacing="1">WMO-No. 8</text>
  <text x="60" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0284c7">METEOROLOGICAL STANDARD</text>
</svg>
